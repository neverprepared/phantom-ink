# phantom-mindwalk — memory-graph visualizer.
#
# Managed by phantom-ink's Integrations (knownServices "mindwalk"). The image is
# published to the fleet registry, so this works on any node that can pull it
# (nodes need `docker login registry.neverprepared.com` — ansible-managed).
# phantom-ink injects at `compose up` (see app_mindwalk.go):
#   BRAIN_URL           brain daemon reachable from inside the container
#   CL_BRAIN_API_TOKEN  the ACTIVE profile's memory-vault bearer token
services:
  mindwalk:
    image: registry.neverprepared.com/phantom-mindwalk:0.3.0
    container_name: phantom-mindwalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:9997:9997"
    environment:
      PORT: 9997
      BIND: 0.0.0.0
      BRAIN_URL: ${BRAIN_URL:-http://host.docker.internal:9998}
      CL_BRAIN_API_TOKEN: ${CL_BRAIN_API_TOKEN:-}
    extra_hosts:
      # host.docker.internal resolves natively on macOS/OrbStack; explicit for Linux.
      - "host.docker.internal:host-gateway"
