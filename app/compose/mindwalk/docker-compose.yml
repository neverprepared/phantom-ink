# phantom-mindwalk — memory-graph visualizer (build-context v1).
#
# Managed by phantom-ink's Integrations (knownServices "mindwalk"). phantom-ink
# injects these at `compose up` (see app_mindwalk.go):
#   MINDWALK_REPO       absolute path to the sibling phantom-mindwalk repo (build context)
#   BRAIN_URL           brain daemon reachable from inside the container
#   CL_BRAIN_API_TOKEN  the ACTIVE profile's memory-vault bearer token
#
# v1 builds the image from source on this box; it is NOT published, so this does
# not work for a packaged .app or other fleet nodes. Publish an image to make it
# portable (deferred).
services:
  mindwalk:
    build:
      context: ${MINDWALK_REPO}
    image: phantom-mindwalk:dev
    container_name: phantom-mindwalk
    restart: unless-stopped
    ports:
      - "127.0.0.1:9997:9997"
    environment:
      PORT: 9997
      BIND: 0.0.0.0
      BRAIN_URL: ${BRAIN_URL:-http://host.docker.internal:9998}
      CL_BRAIN_API_TOKEN: ${CL_BRAIN_API_TOKEN:-}
    extra_hosts:
      # host.docker.internal resolves natively on macOS/OrbStack; explicit for Linux.
      - "host.docker.internal:host-gateway"
