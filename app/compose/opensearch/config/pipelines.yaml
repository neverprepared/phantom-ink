# Data Prepper pipelines — OTLP ingest for Claude Code / brainbox telemetry
#
# Three independent pipelines, one per OTel signal type.
# Traces land in otel-v1-apm-span-* (OpenSearch Trace Analytics UI).
# Metrics and logs use daily-rolling indices.

otel-traces-entry:
  source:
    otel_trace_source:
      port: 21890
      ssl: false
      # Accept OTLP/HTTP protobuf as well as gRPC on this port. Without it the
      # source is gRPC-only: probed against the live instance, a POST to
      # /opentelemetry.proto.collector.trace.v1.TraceService/Export returned
      # 415 and /v1/traces returned 404. Harnesses that export over HTTP --
      # phantom-router uses the otlp-proto-http exporter it already has from
      # Langfuse, rather than adding grpcio -- need this to reach the pipeline.
      unframed_requests: true
  sink:
    - pipeline:
        name: otel-traces-raw
    - pipeline:
        name: otel-service-map

otel-traces-raw:
  source:
    pipeline:
      name: otel-traces-entry
  processor:
    - otel_traces:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-raw

otel-service-map:
  source:
    pipeline:
      name: otel-traces-entry
  processor:
    - service_map_stateful:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: trace-analytics-service-map

otel-metrics:
  source:
    otel_metrics_source:
      port: 21891
      ssl: false
  processor:
    - otel_metrics:
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: custom
        index: metrics-otel-%{yyyy.MM.dd}
        template_type: index-template
        template_content: |
          {
            "template": {
              "mappings": {
                "properties": {
                  "kind": { "type": "keyword" },
                  "name": { "type": "keyword" },
                  "unit": { "type": "keyword" },
                  "startTime": { "type": "date", "format": "strict_date_time" },
                  "time": { "type": "date", "format": "strict_date_time" }
                }
              }
            }
          }

otel-logs:
  source:
    otel_logs_source:
      port: 21892
      ssl: false
  sink:
    - opensearch:
        hosts: ["http://opensearch:9200"]
        index_type: custom
        index: logs-otel-%{yyyy.MM.dd}
        template_type: index-template
        template_content: |
          {
            "template": {
              "mappings": {
                "properties": {
                  "time": { "type": "date", "format": "strict_date_time" },
                  "observedTime": { "type": "date", "format": "strict_date_time" },
                  "severityText": { "type": "keyword" },
                  "body": { "type": "text" },
                  "log": {
                    "properties": {
                      "attributes": {
                        "properties": {
                          "duration_ms": { "type": "long" },
                          "event@sequence": { "type": "long" },
                          "input_tokens": { "type": "long" },
                          "output_tokens": { "type": "long" },
                          "cache_read_tokens": { "type": "long" },
                          "cache_creation_tokens": { "type": "long" },
                          "response_length": { "type": "long" },
                          "prompt_length": { "type": "long" },
                          "tool_input_size_bytes": { "type": "long" },
                          "tool_result_size_bytes": { "type": "long" }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
