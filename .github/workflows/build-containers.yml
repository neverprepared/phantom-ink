name: Build Containers

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "brainbox/**"
    tags:
      - "brainbox/v*"
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-brainbox:
    name: brainbox (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Build brainbox-mcp wheel
        # Dockerfile installs the wheel from packages/brainbox-mcp/dist; the
        # wheel includes the _credentials symlink target resolved by Hatchling
        # at build time. Host-side build keeps a single source of truth in
        # brainbox/src/brainbox/credentials.
        run: |
          rm -rf packages/brainbox-mcp/dist
          (cd packages/brainbox-mcp && uv build --wheel)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/brainbox/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brainbox-arm64
          cache-to: type=gha,scope=brainbox-arm64,mode=max

  build-brainbox-api:
    name: brainbox-api (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox-api/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brainbox-api-arm64
          cache-to: type=gha,scope=brainbox-api-arm64,mode=max

  release-brainbox:
    name: brainbox Homebrew release
    if: startsWith(github.ref, 'refs/tags/brainbox/v')
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#brainbox/v}" >> $GITHUB_OUTPUT

      - name: Build tarball
        run: |
          mkdir -p "brainbox-${{ steps.version.outputs.version }}"
          echo "brainbox ${{ steps.version.outputs.version }}" > "brainbox-${{ steps.version.outputs.version }}/VERSION"
          tar czf "brainbox-${{ steps.version.outputs.version }}.tar.gz" "brainbox-${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: brainbox-${{ steps.version.outputs.version }}.tar.gz
          tag_name: ${{ github.ref_name }}
          name: brainbox v${{ steps.version.outputs.version }}
          generate_release_notes: true

  build-brainbox-ui:
    name: brainbox-ui (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox-ui/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brainbox-ui-arm64
          cache-to: type=gha,scope=brainbox-ui-arm64,mode=max
