name: Build Containers

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "brainbox/**"
    tags:
      - "brainbox/v*"
  workflow_dispatch:

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Build each platform separately to avoid disk space issues,
  # then merge manifests into a multi-arch image.

  build-brainbox-amd64:
    name: brainbox (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/neverprepared/brainbox:amd64
          cache-from: type=gha,scope=brainbox-amd64
          cache-to: type=gha,scope=brainbox-amd64,mode=max

  build-brainbox-arm64:
    name: brainbox (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ghcr.io/neverprepared/brainbox:arm64
          cache-from: type=gha,scope=brainbox-arm64
          cache-to: type=gha,scope=brainbox-arm64,mode=max

  merge-brainbox:
    name: brainbox (manifest)
    runs-on: ubuntu-latest
    needs: [build-brainbox-amd64, build-brainbox-arm64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/brainbox/') }}
      - name: Create and push manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Creating manifest for: $TAG"
            docker buildx imagetools create \
              --tag "$TAG" \
              ghcr.io/neverprepared/brainbox:amd64 \
              ghcr.io/neverprepared/brainbox:arm64
          done

  build-brainbox-api:
    name: brainbox-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brainbox-api
          cache-to: type=gha,scope=brainbox-api,mode=max

  build-brainbox-ui:
    name: brainbox-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/neverprepared/brainbox-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/brainbox-ui/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=brainbox-ui
          cache-to: type=gha,scope=brainbox-ui,mode=max
