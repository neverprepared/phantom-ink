name: Build App

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
    tags:
      - 'app/v*'
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: app/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: cd app/frontend && npm ci

      - name: Build Wails app
        run: cd app && wails build -platform darwin/universal -clean

      - name: Create DMG
        id: dmg
        run: |
          APP_NAME=$(ls app/build/bin/*.app | head -1 | xargs basename | sed 's/\.app//')
          mkdir -p dmg-staging
          cp -r "app/build/bin/${APP_NAME}.app" "dmg-staging/${APP_NAME}.app"
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            -o "${APP_NAME}.dmg"
          echo "DMG_PATH=${APP_NAME}.dmg" >> $GITHUB_OUTPUT
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/app/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dmg.outputs.DMG_PATH }}
          tag_name: ${{ github.ref_name }}
          name: Phantom Ink ${{ github.ref_name }}
          generate_release_notes: true

      - name: Upload DMG artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: phantom-ink-dmg
          path: ${{ steps.dmg.outputs.DMG_PATH }}
          retention-days: 14
