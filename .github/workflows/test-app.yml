name: Test app
on:
  push:
    paths: ['app/**', '.github/workflows/test-app.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/test-app.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Create frontend/dist stub for Go embed
        run: mkdir -p app/frontend/dist && touch app/frontend/dist/.keep
      - name: Run tests
        working-directory: app
        run: go test ./... -v -race -coverprofile=coverage.out
      - name: Coverage report
        working-directory: app
        run: go tool cover -func=coverage.out

      # Frontend unit tests. Added because the resource()/action() primitives
      # guard cross-profile correctness for every panel that uses them, and
      # until now this frontend had no test runner at all -- which is why the
      # window.confirm ban is enforced from the Go suite by scanning source.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Install frontend deps
        working-directory: app/frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: app/frontend
        run: npm test

      # Now a GATE. #385 deliberately left this out because svelte-check exited
      # 1 on 18 pre-existing Go<->TS drift errors and would have failed every
      # PR on debt it did not introduce. Those are now all fixed, so the drift
      # that produced them -- a hand-written interface disagreeing with the
      # generated model -- fails here instead of being discovered months later.
      - name: Frontend typecheck
        working-directory: app/frontend
        run: npm run check
