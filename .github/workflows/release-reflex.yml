name: Release Reflex

on:
  push:
    tags:
      - "reflex-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#reflex-v}" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          cd reflex/plugins
          zip -r "../../reflex-${{ steps.version.outputs.version }}.zip" reflex/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: reflex-${{ steps.version.outputs.version }}.zip
          tag_name: ${{ github.ref_name }}
          name: reflex v${{ steps.version.outputs.version }}
          generate_release_notes: true
