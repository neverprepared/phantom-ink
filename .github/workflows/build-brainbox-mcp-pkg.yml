name: Build brainbox-mcp package

on:
  # `tags` and `paths` under one `push` are ANDed, and there was no `branches`
  # at all — so this could only fire on a brainbox/v* tag whose diff also
  # touched those paths, and never on main. Its only successful run ever was
  # the brainbox/v0.18.0 tag. A change to the package therefore shipped with
  # no build and no check of any kind.
  #
  # Split by intent instead: a release tag always builds and publishes, and a
  # PR that touches the package builds it (the release step is gated on the
  # tag ref, so a PR run cannot publish).
  push:
    tags:
      - "brainbox/v*"
  pull_request:
    paths:
      - "packages/brainbox-mcp/**"
      - ".github/workflows/build-brainbox-mcp-pkg.yml"
  workflow_dispatch:

concurrency:
  group: brainbox-mcp-pkg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Build .deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/brainbox/v* ]]; then
            VERSION="${GITHUB_REF_NAME#brainbox/v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install fpm
        run: |
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Assemble package tree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_ROOT="$(pwd)/pkg-root"
          SITE_PKG="$PKG_ROOT/usr/lib/python3/dist-packages"
          BIN="$PKG_ROOT/usr/bin"
          mkdir -p "$SITE_PKG/brainbox_mcp" "$BIN"

          cp packages/brainbox-mcp/src/brainbox_mcp/__init__.py  "$SITE_PKG/brainbox_mcp/"
          cp packages/brainbox-mcp/src/brainbox_mcp/__main__.py  "$SITE_PKG/brainbox_mcp/"
          cp packages/brainbox-mcp/src/brainbox_mcp/mcp_server.py "$SITE_PKG/brainbox_mcp/"
          cp packages/brainbox-mcp/src/brainbox_mcp/log.py        "$SITE_PKG/brainbox_mcp/"

          # Wrapper script — uses system python3 so it picks up the site-packages above
          cat > "$BIN/brainbox-mcp" <<'EOF'
          #!/bin/bash
          exec python3 -m brainbox_mcp "$@"
          EOF
          chmod 0755 "$BIN/brainbox-mcp"

      - name: Write postinst script
        run: |
          cat > postinst.sh <<'EOF'
          #!/bin/bash
          set -e
          # Install PyPI dependencies that have no apt equivalents.
          # NOTE: this restates packages/brainbox-mcp/pyproject.toml's
          # dependencies because the .deb ships source plus a `python3 -m
          # brainbox_mcp` wrapper, so there is no wheel whose own metadata
          # could be resolved here. Keep it in step by hand: it was left a
          # major behind during the move to mcp 2.x, which would have installed
          # an SDK the code no longer imports against. Deliberately no stale
          # constraint quoted here — this comment ships inside the .deb, and a
          # second version string in the file defeats grepping for the real one.
          # tests/test_phantom_session_wrapper.py pins it to the pyproject.
          # Prefer uv (available in brainbox containers) for speed; fall back to pip3.
          if command -v uv &>/dev/null; then
              uv pip install --system "mcp[cli]>=2.3,<3" "structlog>=24.4" --quiet
          else
              pip3 install --quiet "mcp[cli]>=2.3,<3" "structlog>=24.4"
          fi
          EOF
          chmod 0755 postinst.sh

      - name: Build .deb
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          fpm \
            -s dir \
            -t deb \
            -C pkg-root \
            -n brainbox-mcp \
            -v "$VERSION" \
            --description "Brainbox MCP server — exposes the brainbox API as Claude MCP tools" \
            --url "https://github.com/neverprepared/phantom-ink" \
            --license MIT \
            --depends python3 \
            --architecture all \
            --after-install postinst.sh \
            --deb-no-default-config-files \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: brainbox-mcp-deb
          path: "*.deb"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/brainbox/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
          tag_name: ${{ github.ref_name }}
          name: brainbox ${{ github.ref_name }}
          generate_release_notes: false
