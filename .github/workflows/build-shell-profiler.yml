name: Build shell-profiler

on:
  push:
    branches:
      - main
    paths:
      - "shell-profiler/**"
    tags:
      - "shell-profiler/v*"
  workflow_dispatch:

concurrency:
  group: shell-profiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: shell-profiler/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd shell-profiler
          go build -ldflags="-s -w" -o shell-profiler ./cmd/shell-profiler

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#shell-profiler/v}"
          # On non-tag builds use short SHA as version label
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" != "true" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="shell-profiler-v${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          cp shell-profiler/shell-profiler "$NAME/"
          tar czf "${NAME}.tar.gz" "$NAME"

      - name: Install fpm
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Build .deb package
        if: matrix.goos == 'linux'
        run: |
          VERSION="${GITHUB_REF_NAME#shell-profiler/v}"
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" != "true" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi

          mkdir -p pkg-root/usr/bin
          cp shell-profiler/shell-profiler pkg-root/usr/bin/shell-profiler

          # Map Go arch names to Debian arch names
          DEB_ARCH="${{ matrix.goarch }}"
          [ "$DEB_ARCH" = "amd64" ] && DEB_ARCH="amd64"
          [ "$DEB_ARCH" = "arm64" ] && DEB_ARCH="arm64"

          fpm \
            -s dir \
            -t deb \
            -C pkg-root \
            -n shell-profiler \
            -v "$VERSION" \
            --description "Workspace profile manager using direnv for environment-specific configurations" \
            --url "https://github.com/neverprepared/phantom-ink" \
            --license MIT \
            --depends direnv \
            --architecture "$DEB_ARCH" \
            --deb-no-default-config-files \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-profiler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            shell-profiler-*.tar.gz
            *.deb

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/shell-profiler/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shell-profiler-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shell-profiler-*.tar.gz
            *.deb
          tag_name: ${{ github.ref_name }}
          name: shell-profiler ${{ github.ref_name }}
          generate_release_notes: true
