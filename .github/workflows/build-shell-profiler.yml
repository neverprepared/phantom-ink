name: Build shell-profiler

on:
  push:
    branches:
      - main
    paths:
      - "shell-profiler/**"
    tags:
      - "shell-profiler/v*"
  workflow_dispatch:

concurrency:
  group: shell-profiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: shell-profiler/go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          cd shell-profiler
          go build -ldflags="-s -w" -o shell-profiler ./cmd/shell-profiler

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#shell-profiler/v}"
          # On non-tag builds use short SHA as version label
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" != "true" ]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="shell-profiler-v${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$NAME"
          cp shell-profiler/shell-profiler "$NAME/"
          tar czf "${NAME}.tar.gz" "$NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-profiler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: shell-profiler-*.tar.gz

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/shell-profiler/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: shell-profiler-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: shell-profiler-*.tar.gz
          tag_name: ${{ github.ref_name }}
          name: shell-profiler ${{ github.ref_name }}
          generate_release_notes: true
