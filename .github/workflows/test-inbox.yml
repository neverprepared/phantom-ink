name: Test inbox
on:
  # Branch pushes are covered by the pull_request trigger. Without the branch
  # filter both events fire on a PR branch, producing two identical runs of the
  # same commit -- and if either is left unscheduled the PR sits at UNSTABLE
  # forever waiting on a duplicate. One run per commit instead.
  push:
    branches: [main]
    paths: ['scripts/inbox/**', '.github/workflows/test-inbox.yml']
  pull_request:
    paths: ['scripts/inbox/**', '.github/workflows/test-inbox.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/inbox
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The whole suite is offline: Drive, the router/Ollama call and the
      # macos-mcp server are all stubbed, so this needs no credentials and no
      # macOS runner. test_contract.py does read the committed
      # app/internal/contract/timeline-entry.schema.json, which is why the
      # checkout must not be sparse.
      # Dependencies come from tests/requirements.txt, which the `inbox-test`
      # Justfile recipe also reads. They used to be listed separately here, so
      # adding one locally left CI installing the old set.
      - name: Run tests
        run: |
          uv run --with-requirements tests/requirements.txt \
                 python -m pytest tests/ -q

      - name: Lint
        run: uvx ruff check .

      - name: Format check
        run: uvx ruff format --check .

      # The stage scripts carry PEP-723 inline dependency metadata and are run
      # with `uv run --script`. A syntax error or a bad dependency spec would
      # otherwise only surface on a scheduled run, where a non-zero exit just
      # lands silently in the job's last_error.
      - name: Scripts are runnable
        run: |
          uv run --script drive_drain.py --help > /dev/null
          uv run --script extract_apply.py --help > /dev/null
