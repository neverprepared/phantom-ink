name: Test brainbox
on:
  push:
    paths: ['brainbox/**', '.github/workflows/test-brainbox.yml']
  pull_request:
    paths: ['brainbox/**', '.github/workflows/test-brainbox.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brainbox
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: brainbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # brainbox's store runs on Postgres — the suite needs a live DB.
      CL_DATABASE_URL: postgresql://postgres:test@localhost:5432/brainbox_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest tests/ -v --tb=short --cov=src/brainbox --cov-report=term-missing
