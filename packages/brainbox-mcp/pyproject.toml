[project]
name = "brainbox-mcp"
version = "0.0.0"  # overridden at build time via --no-isolation + hatch version
description = "Brainbox MCP server — exposes the brainbox API as Claude MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9",
    "structlog>=24.4",
]

[project.scripts]
brainbox-mcp = "brainbox_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainbox_mcp"]
