[project]
name = "brainbox-mcp"
version = "0.0.0"  # overridden at build time via --no-isolation + hatch version
description = "Brainbox guest helpers — MCP server"
requires-python = ">=3.11"
dependencies = [
    # Migrated to mcp 2.x: the server class is MCPServer from
    # mcp.server.mcpserver (FastMCP was its 1.x name and is gone), so the old
    # <2 pin is no longer what keeps this working — the floor is.
    #
    # Keeping the history, because the failure shape is worth knowing: while
    # the code still imported mcp.server.fastmcp, an unpinned build resolved
    # 2.x and brainbox-mcp exited 1 at startup with ModuleNotFoundError, which
    # Claude Code surfaces only as CONNECTION_CLOSED — naming nothing. It went
    # unnoticed for weeks because the session image had been built while 1.x
    # was current, and the first fresh rebuild broke every session's channel_*
    # tools. That is the argument for a FLOOR on the SDK, not a ceiling: a
    # ceiling only defers the same break to the next bump.
    "mcp[cli]>=2.3,<3",
    "structlog>=24.4",
]

[project.scripts]
brainbox-mcp = "brainbox_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainbox_mcp"]
