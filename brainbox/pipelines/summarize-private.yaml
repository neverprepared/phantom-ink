name: summarize-private
description: >
  Summarize documents, notes, or transcripts using Ollama (private, local).
  Two-step: extract key information, then format as a clean markdown report.
  Output: $WORKSPACE_HOME/documents/outputs/
version: "1"

steps:
  - name: analyze
    type: ollama-chat
    timeout: 300
    config:
      model: "qwen3:8b"
      system_prompt: >
        You are a document analyst. Extract structured information from the
        provided text. Be thorough — capture every key point, decision,
        action item, and open question. Identify attendees if present.
        Adapt your analysis to the document type (meeting notes, transcript,
        legal document, report, etc.).
      prompt: >
        Analyze this document and extract:
        1. Document type and subject
        2. Key participants or stakeholders (if identifiable)
        3. Main topics or sections (3-7 items with brief descriptions)
        4. Decisions, conclusions, or findings
        5. Action items or next steps (with owners and deadlines if mentioned)
        6. Open questions or unresolved items

        Title: ${params.title}
        Date: ${params.date}

        Document text:
        ${params.text}

  - name: format
    type: ollama-chat
    depends_on: [analyze]
    timeout: 300
    config:
      model: "qwen3:8b"
      system_prompt: >
        You are a document formatter. Produce clean, professional markdown.
        Only format what is provided — do not invent information. Use tables
        for action items. Keep it scannable.
      prompt: >
        Format into a markdown summary using this structure:

        # Summary: ${params.title}

        **Date:** ${params.date}
        **Generated by:** Ollama (private/local)

        ## Executive Summary
        (2-4 sentences covering purpose and outcomes)

        ## Key Topics
        (numbered list)

        ## Decisions & Findings
        (bulleted list, or "None recorded")

        ## Action Items
        | Action | Owner | Deadline |
        |--------|-------|----------|
        (or "No action items identified")

        ## Open Questions
        (bulleted list, or "None")

        ---
        *Generated via summarize-private pipeline (Ollama qwen3:8b)*

        Analysis to format:
        ${steps.analyze.output}
