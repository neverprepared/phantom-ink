name: macos-audit
description: >
  Launch a macOS UTM VM, audit installed software and system configuration,
  then format the results into a compliance report. Demonstrates the session
  step type with UTM backend and macOS guest OS.
version: "1"

steps:
  - name: collect-system-info
    type: session
    timeout: 300
    config:
      backend: utm
      llm_provider: claude
      guest_os: macos
      vm_template: "${params.vm_template}"
      session_prefix: "macos-audit"
      prompt: >
        You are running inside a macOS VM. Collect the following system
        information and return it as structured text:

        1. macOS version: run `sw_vers`
        2. Hardware: run `system_profiler SPHardwareDataType`
        3. Installed Homebrew packages: run `brew list --versions 2>/dev/null || echo "Homebrew not installed"`
        4. Running services: run `launchctl list | head -30`
        5. Disk usage: run `df -h /`
        6. Network config: run `ifconfig en0 2>/dev/null | head -10`
        7. User accounts: run `dscl . -list /Users | grep -v '^_'`

        Return ALL output — do not summarize or skip any commands.

  - name: analyze-compliance
    type: ollama-chat
    depends_on: [collect-system-info]
    timeout: 120
    config:
      model: "qwen3:8b"
      system_prompt: >
        You are an IT compliance auditor. Analyze macOS system information
        and flag any issues: outdated software, security concerns, missing
        patches, unusual user accounts, or resource problems.
      prompt: >
        Analyze this macOS system audit data and identify any compliance
        issues, security concerns, or maintenance items:

        ${steps.collect-system-info.output}

  - name: format-report
    type: ollama-chat
    depends_on: [collect-system-info, analyze-compliance]
    timeout: 120
    config:
      model: "qwen3:8b"
      system_prompt: >
        You are a report formatter. Produce clean, professional markdown.
        Only include information from the provided data.
      prompt: >
        Format into a macOS compliance audit report:

        # macOS System Audit Report

        **Date:** ${params.date}
        **VM Template:** ${params.vm_template}
        **Generated by:** Mixed pipeline (UTM + Ollama)

        ## System Overview
        (from system info)

        ## Installed Software
        (from brew list)

        ## Compliance Findings
        (from analysis — categorize as Critical / Warning / Info)

        ## Recommendations
        (prioritized action items)

        ---
        *Generated via macos-audit pipeline*

        System data:
        ${steps.collect-system-info.output}

        Analysis:
        ${steps.analyze-compliance.output}
