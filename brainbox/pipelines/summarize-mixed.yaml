name: summarize-mixed
description: >
  Summarize documents using mixed providers: Ollama (private) for fast
  first-pass analysis, then a Claude container session for high-quality
  formatting. Demonstrates the session step type with different backends.
version: "1"

steps:
  - name: analyze
    type: ollama-chat
    timeout: 300
    config:
      model: "qwen3:8b"
      system_prompt: >
        You are a document analyst. Extract structured information from the
        provided text. Be thorough. Adapt to the document type.
      prompt: >
        Analyze this document and extract:
        1. Document type and subject
        2. Key participants or stakeholders
        3. Main topics (3-7 items)
        4. Decisions, conclusions, or findings
        5. Action items with owners and deadlines
        6. Open questions

        Title: ${params.title}
        Date: ${params.date}

        Document text:
        ${params.text}

  - name: format
    type: session
    depends_on: [analyze]
    timeout: 300
    config:
      backend: docker
      llm_provider: claude
      session_prefix: "summarize-fmt"
      system_prompt: >
        You are a professional report writer. Format the analysis into a clean
        markdown report. Return ONLY the formatted markdown — no tool calls.
      prompt: >
        Format into a markdown summary:

        # Summary: ${params.title}
        **Date:** ${params.date}
        **Generated by:** Mixed pipeline (Ollama analysis + Claude formatting)

        ## Executive Summary
        ## Key Topics
        ## Decisions & Findings
        ## Action Items
        | Action | Owner | Deadline |
        |--------|-------|----------|
        ## Open Questions

        ---
        *Generated via summarize-mixed pipeline*

        Analysis:
        ${steps.analyze.output}
