name: summarize-cloud
description: >
  Summarize documents, notes, or transcripts using Claude (cloud).
  Single-step — Claude handles analysis and formatting in one pass
  for higher quality output. Requires a running brainbox container.
  Output: $WORKSPACE_HOME/documents/outputs/
version: "1"

steps:
  - name: summarize
    type: claude-session
    timeout: 300
    config:
      session_prefix: "summarize"
      system_prompt: >
        You are a senior analyst and professional writer. Analyze the provided
        document and produce a clean, comprehensive markdown summary. Adapt
        your analysis to the document type (meeting notes, transcript, legal
        document, technical report, etc.). Be thorough but concise.

        Return ONLY the formatted markdown — no tool calls, no file operations.
      prompt: >
        Summarize the following document into a professional markdown report.

        Use this structure:

        # Summary: ${params.title}

        **Date:** ${params.date}
        **Generated by:** Claude (cloud)

        ## Executive Summary
        (2-4 sentences covering purpose and key outcomes)

        ## Key Topics
        (numbered list with brief descriptions, 3-7 items)

        ## Decisions & Findings
        (bulleted list with context, or "None recorded")

        ## Action Items
        | Action | Owner | Deadline |
        |--------|-------|----------|
        (from the document, or "No action items identified")

        ## Open Questions
        (bulleted list, or "None")

        ## Notable Details
        (anything important that doesn't fit above — quotes, caveats, context)

        ---
        *Generated via summarize-cloud pipeline (Claude)*

        Title: ${params.title}
        Date: ${params.date}

        Document text:
        ${params.text}
