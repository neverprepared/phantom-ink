[project]
name = "brainbox"
version = "0.18.0"
description = "Sandboxed Docker container orchestration for Claude Code"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "docker>=7.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sse-starlette>=2.1",
    "boto3>=1.26",
    "slowapi>=0.1.9",
    "httpx>=0.28",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "mcp-utm>=0.1.2; sys_platform == 'darwin'",
    # Held below 2.x deliberately: gateway_server.py and gateway_http.py use
    # mcp.server.lowlevel.Server, which mcp 2.0 removed. This was UNBOUNDED,
    # so the next lock refresh would have resolved 2.x and broken `brainbox
    # mcp` and the gateway fork at import — the failure Claude Code reports
    # only as CONNECTION_CLOSED. Lifting this ceiling means migrating off the
    # low-level Server API, which is the same work phantom-mcp-gateway needs
    # and is not a rename.
    "mcp>=1.9,<2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyrage>=1.2",
    "zstandard>=0.22",
    "jmespath>=1.1.0",
    "opensearch-py>=2.6",
]

[project.scripts]
brainbox = "brainbox.__main__:main"
manage-secrets = "brainbox.manage_secrets:main"

[project.optional-dependencies]
cli = ["questionary>=2.0", "rich>=13.9"]
mcp = ["mcp[cli]>=1.9"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brainbox"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
